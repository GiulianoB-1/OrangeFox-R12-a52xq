name: Build OrangeFox R12 for Galaxy A52 5G

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orangefox-a52xq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      FOX_BRANCH: "12.1"
      FOX_DIR: /home/runner/fox_12.1
      DEVICE: a52xq
      DEVICE_TREE: /home/runner/fox_12.1/device/samsung/a52xq
      PARTITION_SIZE: "81788928"
      KERNEL_REPO: GiulianoB-1/A52-touchGrass-4.19.325-SukiSU
      KERNEL_RUN_ID: "32509295678"
      KERNEL_ARTIFACT: a52xq-recovery-preserve-ramoops-3-KERNEL

    steps:
      - name: Checkout R12 builder overlay
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5-dev libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lz4 lzop openjdk-11-jdk \
            pngcrush python3 python-is-python3 rsync schedtool \
            squashfs-tools unzip wget xsltproc xz-utils zip zlib1g-dev

      - name: Configure Git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global init.defaultBranch main

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync current OrangeFox 12.1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/OrangeFox_sync"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/OrangeFox_sync/sync"
          cd "$HOME/OrangeFox_sync/sync"
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$FOX_DIR"
          test -f "$FOX_DIR/build/envsetup.sh"
          df -h

      - name: Apply APEX loop and recovery-restart fixes
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/patch-apex-loop.sh "$FOX_DIR"

      - name: Clone proven A52 5G device tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DEVICE_TREE"
          git lfs install
          git clone https://github.com/itsaschoolbus-stuff/fox_device_samsung_a52xq.git "$DEVICE_TREE"
          git -C "$DEVICE_TREE" checkout 8690f6b04e598ea82b5986575ee72c352cd6e805
          git -C "$DEVICE_TREE" lfs pull || true
          git -C "$DEVICE_TREE" log -1 --oneline

      - name: Inject 4.19.206 ramoops-preservation recovery kernel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          KDIR="$RUNNER_TEMP/recovery-preserve-kernel-$KERNEL_RUN_ID"
          rm -rf "$KDIR"
          mkdir -p "$KDIR"

          echo "Waiting for exact preservation-kernel run $KERNEL_REPO/$KERNEL_RUN_ID"
          status=""
          conclusion=""
          for n in $(seq 1 180); do
            status="$(gh api "repos/$KERNEL_REPO/actions/runs/$KERNEL_RUN_ID" --jq '.status')"
            conclusion="$(gh api "repos/$KERNEL_REPO/actions/runs/$KERNEL_RUN_ID" --jq '.conclusion // ""')"
            attempt="$(gh api "repos/$KERNEL_REPO/actions/runs/$KERNEL_RUN_ID" --jq '.run_attempt')"
            echo "kernel run: attempt=$attempt status=$status conclusion=${conclusion:-pending}"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || {
                echo "ERROR: preservation-kernel run completed with $conclusion" >&2
                exit 1
              }
              break
            fi
            sleep 30
          done
          [[ "$status" == "completed" && "$conclusion" == "success" ]] || {
            echo "ERROR: timed out waiting for preservation-kernel run" >&2
            exit 1
          }

          echo "Downloading '$KERNEL_ARTIFACT' from $KERNEL_REPO run $KERNEL_RUN_ID"
          gh run download "$KERNEL_RUN_ID" \
            --repo "$KERNEL_REPO" \
            --name "$KERNEL_ARTIFACT" \
            --dir "$KDIR"

          IMAGE_GZ="$(find "$KDIR" -type f -name Image.gz -print -quit)"
          IMAGE_RAW="$(find "$KDIR" -type f -name Image -print -quit)"
          FINAL_CONFIG="$(find "$KDIR" -type f -name final.config -print -quit)"
          AUDIT="$(find "$KDIR" -type f -name preservation-audit.json -print -quit)"

          test -n "$IMAGE_GZ" && test -s "$IMAGE_GZ"
          test -n "$FINAL_CONFIG" && test -s "$FINAL_CONFIG"
          test -n "$AUDIT" && test -s "$AUDIT"
          gzip -t "$IMAGE_GZ"

          if [[ -z "$IMAGE_RAW" || ! -s "$IMAGE_RAW" ]]; then
            IMAGE_RAW="$KDIR/Image.decoded"
            gzip -dc "$IMAGE_GZ" > "$IMAGE_RAW"
          fi

          python3 - "$AUDIT" <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p))
          if d.get('status') != 'passed':
              raise SystemExit('preservation audit did not pass')
          if d.get('preserved_range') != '0xB1B00000-0xB1BFFFFF':
              raise SystemExit('unexpected preserved ramoops range')
          required = (
              'snapshot_marker_in_image',
              'device_marker_in_image',
              'pstore_ram_disabled',
              'pstore_console_disabled',
              'pstore_pmsg_disabled',
          )
          bad = [k for k in required if not d.get('checks', {}).get(k)]
          if bad:
              raise SystemExit('preservation audit checks failed: ' + ', '.join(bad))
          print('preservation-audit.json: PASS')
          PY

          grep -Fxq 'CONFIG_PSTORE=y' "$FINAL_CONFIG"
          grep -Fxq '# CONFIG_PSTORE_RAM is not set' "$FINAL_CONFIG"
          grep -Fxq '# CONFIG_PSTORE_CONSOLE is not set' "$FINAL_CONFIG"
          grep -Fxq '# CONFIG_PSTORE_PMSG is not set' "$FINAL_CONFIG"

          grep -aFq 'a52_ramoops_raw: captured 0x%llx-0x%llx before ramoops init' "$IMAGE_RAW"
          grep -aFq '/dev/a52_ramoops_raw ready, size=%u' "$IMAGE_RAW"

          KERNEL_RELEASE="$(strings "$IMAGE_RAW" | grep -m1 '^Linux version ' || true)"
          echo "$KERNEL_RELEASE"
          [[ "$KERNEL_RELEASE" == *"4.19.206"* ]] || {
            echo "ERROR: expected Linux 4.19.206 preservation kernel" >&2
            exit 1
          }

          cp -f "$IMAGE_GZ" "$DEVICE_TREE/prebuilt/Image.gz"
          gzip -t "$DEVICE_TREE/prebuilt/Image.gz"

          RAW_SHA="$(sha256sum "$IMAGE_RAW" | awk '{print $1}')"
          GZ_SHA="$(sha256sum "$DEVICE_TREE/prebuilt/Image.gz" | awk '{print $1}')"
          {
            echo "source_repo=$KERNEL_REPO"
            echo "source_run=$KERNEL_RUN_ID"
            echo "artifact=$KERNEL_ARTIFACT"
            echo "kernel_release=$KERNEL_RELEASE"
            echo "raw_image_sha256=$RAW_SHA"
            echo "recovery_prebuilt_sha256=$GZ_SHA"
            echo "preserved_range=0xB1B00000-0xB1BFFFFF"
            echo "a52_ramoops_raw=yes"
            echo "pstore_ram=disabled"
            echo "pstore_console=disabled"
            echo "pstore_pmsg=disabled"
          } | tee "$GITHUB_WORKSPACE/kernel-provenance.txt"

      - name: Apply working MicroSD and USB-OTG fixes
        run: |
          bash ./scripts/patch-device-tree.sh "$DEVICE_TREE"
          echo "----- Patched storage configuration -----"
          grep -nE 'MicroSD|USB-Storage|usb_otg|sdcard1' \
            "$DEVICE_TREE/recovery/root/system/etc/twrp.flags"
          echo "----- Patched imports -----"
          grep -n 'init.of_sdcard.rc' "$DEVICE_TREE/recovery/root/init.recovery.qcom.rc"
          echo "----- Patched properties -----"
          grep -nE 'isUsbOtgEnabled|oem.otg_support' "$DEVICE_TREE/system.prop"

      - name: Validate device-tree build inputs
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY_KERNEL_RAW="$RUNNER_TEMP/orangefox-recovery-kernel-validate"
          rm -f "$RECOVERY_KERNEL_RAW"
          gzip -dc "$DEVICE_TREE/prebuilt/Image.gz" > "$RECOVERY_KERNEL_RAW"
          test -s "$RECOVERY_KERNEL_RAW"
          {
            echo "Device tree commit:"
            git -C "$DEVICE_TREE" log -1 --oneline
            echo
            echo "Kernel provenance:"
            cat "$GITHUB_WORKSPACE/kernel-provenance.txt"
            echo
            echo "Recovery kernel:"
            RECOVERY_KERNEL="$(strings "$RECOVERY_KERNEL_RAW" | grep -m1 '^Linux version ' || true)"
            echo "$RECOVERY_KERNEL"
            [[ "$RECOVERY_KERNEL" == *"4.19.206"* ]]
            grep -aFq 'a52_ramoops_raw: captured 0x%llx-0x%llx before ramoops init' "$RECOVERY_KERNEL_RAW"
            grep -aFq '/dev/a52_ramoops_raw ready, size=%u' "$RECOVERY_KERNEL_RAW"
            EXPECTED_GZ_SHA="$(awk -F= '$1=="recovery_prebuilt_sha256" {print $2}' "$GITHUB_WORKSPACE/kernel-provenance.txt")"
            ACTUAL_GZ_SHA="$(sha256sum "$DEVICE_TREE/prebuilt/Image.gz" | awk '{print $1}')"
            [[ -n "$EXPECTED_GZ_SHA" && "$EXPECTED_GZ_SHA" == "$ACTUAL_GZ_SHA" ]]
            echo
            echo "Prebuilt image details:"
            for file in \
              "$DEVICE_TREE/prebuilt/Image.gz" \
              "$DEVICE_TREE/prebuilt/dtb.img" \
              "$DEVICE_TREE/prebuilt/dtbo.img"; do
              test -s "$file"
              wc -c "$file"
              file "$file"
              if head -c 200 "$file" | grep -q 'git-lfs.github.com/spec'; then
                echo "ERROR: $file is still a Git LFS pointer"
                exit 1
              fi
            done
          } | tee "$GITHUB_WORKSPACE/tree-info.txt"
          rm -f "$RECOVERY_KERNEL_RAW"

      - name: Build OrangeFox recovery image
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          set -x
          set -o pipefail
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "::error::OrangeFox build setup or compilation failed with exit code $status"; tail -n 200 "$LOG"; fi; exit "$status"' EXIT

          cd "$FOX_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="$DEVICE"
          export LC_ALL=C
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
          export OF_FORCE_PREBUILT_KERNEL=1

          # The previous runner restored /home/runner/.ccache as read-only.
          # Disable ccache completely for a reliable first successful build.
          export USE_CCACHE=0
          unset CCACHE_DIR CCACHE_TEMPDIR CCACHE_EXEC

          test -f build/envsetup.sh
          test -f "$DEVICE_TREE/AndroidProducts.mk"

          # Android envsetup scripts can return a non-zero status from harmless
          # capability tests. Do not use `set -e` while sourcing them.
          set +e
          source build/envsetup.sh
          ENVSETUP_STATUS=$?
          set -e
          echo "build/envsetup.sh returned $ENVSETUP_STATUS; validating loaded functions"
          type lunch
          type mka

          lunch twrp_a52xq-eng
          mka adbd recoveryimage

          trap - EXIT

      - name: Collect and verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$FOX_DIR/out/target/product/$DEVICE"
          mkdir -p "$GITHUB_WORKSPACE/output"
          find "$PRODUCT" -maxdepth 1 -type f \
            \( -name 'OrangeFox*.img' -o -name 'OrangeFox*.zip' -o -name 'recovery.img' \) \
            -print -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;

          IMAGE="$(find "$GITHUB_WORKSPACE/output" -maxdepth 1 -type f -name 'OrangeFox*.img' | head -n1)"
          if [[ -z "$IMAGE" ]]; then
            IMAGE="$GITHUB_WORKSPACE/output/recovery.img"
          fi
          test -f "$IMAGE"

          python3 "$GITHUB_WORKSPACE/scripts/verify-built-image.py" \
            "$IMAGE" --partition-size "$PARTITION_SIZE" | tee "$GITHUB_WORKSPACE/verification.txt"
          sha256sum "$GITHUB_WORKSPACE/output"/* | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload OrangeFox R12 build
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12-a52xq-${{ github.run_number }}
          path: |
            output/*
            SHA256SUMS.txt
            verification.txt
            kernel-provenance.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12-a52xq-diagnostics-${{ github.run_number }}
          path: |
            build.log
            tree-info.txt
            kernel-provenance.txt
          if-no-files-found: warn
          retention-days: 14
